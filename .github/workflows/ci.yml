name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app run.py
      - name: Import application
        env:
          BOT_TOKEN: '123:dummy'
          API_ID: '12345'
          API_HASH: '0123456789abcdef0123456789abcdef'
          DATABASE_URL: 'sqlite+aiosqlite:///ci.db'
          SESSION_SECRET: 'ci-secret-only-for-import-check'
        run: python -c "import app.main; print('IMPORT_OK')"
